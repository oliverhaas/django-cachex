[project]
name = "django-cachex"
version = "0.13.1"
description = "Valkey and Redis cache backends for Django: standalone, Sentinel and Cluster topologies, sync and async APIs, and an ORM query cache"
readme = "README.md"
license = "MIT AND BSD-3-Clause"
# BSD-3-Clause: django_cachex/orm is derived from django-cachalot, and the
# serializers, compressors and exceptions from django-redis.
license-files = ["LICENSE", "LICENSE.django-redis", "django_cachex/orm/LICENSE"]
requires-python = ">=3.14"
keywords = [
  "django",
  "valkey",
  "redis",
  "cache",
  "backend",
  "orm",
  "query cache",
]
authors = [{ name = "Oliver Haas", email = "ohaas@e1plus.de" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Framework :: Django",
  "Framework :: Django :: 6.0",
  "Framework :: Django :: 6.1",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Free Threading :: 1 - Unstable",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Software Development :: Libraries",
  "Topic :: Utilities",
  "Typing :: Typed",
]
dependencies = ["Django>=6,<7", "sortedcontainers>=2.4"]

[project.optional-dependencies]
valkey-py = ["valkey>=6.1.0,<7"]
libvalkey = ["valkey[libvalkey]>=6.1.0,<7"]
redis-py = ["redis>=7.2,<9"]
hiredis = ["redis[hiredis]<9,>=7.2"]
# valkey-glide: Rust-cored Valkey client. Sync and async are separate distributions.
valkey-glide = ["valkey-glide-sync>=2.5,<3", "valkey-glide>=2.5,<3"]
# Compressors
lz4 = ["lz4>=4.4.0"]
# Serializers
msgpack = ["msgpack>=1.1.0"]
ormsgpack = ["ormsgpack>=1.10.0"]
orjson = ["orjson>=3.10.0"]

[project.urls]
Homepage = "https://github.com/oliverhaas/django-cachex"
Documentation = "https://oliverhaas.github.io/django-cachex/"
Repository = "https://github.com/oliverhaas/django-cachex.git"
Changelog = "https://oliverhaas.github.io/django-cachex/latest/reference/changelog/"

[dependency-groups]
dev = [
  "valkey[libvalkey]==6.1.1",
  "redis[hiredis]==8.1.0",
  "beautifulsoup4==4.15.0",
  "django-stubs==6.1.1",
  "djlint==1.46.4",
  "lz4==4.4.5",
  "msgpack==1.2.3",
  "ormsgpack==1.12.2",
  "mypy==2.4.0",
  "pre-commit==4.6.2",
  # ORM cache tests (tests/orm) on PostgreSQL. The pure-Python build loads the
  # system libpq, so it installs on the free-threaded interpreter as well.
  "psycopg==3.3.6",
  "pytest-asyncio==1.4.0",
  "pytest-cov==7.1.0",
  "pytest-django==4.14.0",
  "pytest-flakefinder==1.1.0",
  "pytest-mock==3.16.0",
  "pytest-xdist==3.8.0",
  "pytest==9.1.1",
  "ruff==0.16.10",
  "testcontainers==4.15.0",
  "ty==0.0.84",
  "types-docker==7.2.0.20260923",
  # ASGI benchmark only: granian (real ASGI server) plus httpx (load gen).
  "granian>=2.6,<3",
  "httpx>=0.28,<0.29",
  # ORM benchmark only: the django-cachalot release the ORM cache derives from.
  "django-cachalot==2.9.1",
  # Full example: workspace member so its deps (notably celery) survive
  # ``uv sync``, which the pre-commit hook runs on every commit.
  "django-cachex-full-example",
]
# valkey-glide ships prebuilt wheels for cp310 through cp314 (GIL builds) but has no
# cp314t free-threaded wheel; the source build needs protoc. Keep it out of
# `dev` so `uv sync` works on the cp314t interpreter; opt in via
# `uv sync --extra valkey-glide` on a GIL build (cp312/cp313/cp314) when
# working on the backend or running the glide test slice.
docs = ["mkdocs==1.6.1", "mkdocs-material==9.7.7", "mike==2.2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["django_cachex"]

[tool.hatch.build.targets.sdist]
include = [
  "django_cachex/**",
  "/README.md",
  "/LICENSE",
  "/LICENSE.django-redis",
  "/pyproject.toml",
]

[tool.uv.workspace]
members = ["examples/full"]

[tool.uv.sources]
django-cachex-full-example = { workspace = true }

[tool.ruff]
target-version = "py314"
line-length = 120
fix = true

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "A002",     # min/max params match Redis API naming (ZCOUNT key min max, etc.)
  "A003",     # Cache methods named `set`/`type` mirror Redis API; `self.set(...)` is unambiguous.
  "ANN401",   # Any is correct for cache values (arbitrary Python objects)
  "ARG002",   # Unused args: API compat (key in get_client), stub classes (*args, **kwargs)
  "ASYNC109", # timeout param is cache TTL, not asyncio.timeout
  "COM812",   # Conflicts with ruff-format
  "CPY",      # No per-file copyright notices in this project
  "D",        # Docstrings - will add incrementally
  "E501",     # Line length handled by config
  "EM",       # Exception strings inline are fine
  "FBT",      # Boolean params match Redis API (approximate, nomkstream, mkstream, noack, justid, force, full)
  "PERF203",  # try/except in loop is fine here
  "PLC0415",  # Dynamic imports intentional
  "PLR0913",  # Too many args - Redis commands have many options (zadd, lock, lpos, blmove)
  "PLR0917",  # Too many positional args - same rationale as PLR0913
  "PLR2004",  # Magic values like -2 for TTL are Redis-documented return codes
  "SLF001",   # Private member access needed for Cache/CacheClient delegation
  "TRY003",   # Long exception messages are helpful for debugging
  "TRY300",   # return in try block is cleaner for this pattern (Redis call, decode, return)
  "SIM108",   # Ternary not always clearer
]

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true      # Allow Any for *args and **kwargs
suppress-none-returning = true # Don't require -> None on functions

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
  "ANN",    # Type annotations not required in tests
  "ARG",    # Unused arguments common in fixtures
  "DTZ005", # Timezone-naive datetime okay in tests
  "F841",   # Unused variables okay in tests
  "FBT",    # Boolean args fine in test fixtures and test calls
  "PT006",  # Parametrize tuple style is preference
  "PT011",  # Broad pytest.raises okay in some tests
  "PT013",  # pytest import style is preference
  "PT018",  # Compound assertions okay in tests
  "RUF002", # Unicode in docstrings is fine
  "RUF015", # next(iter()) vs slice is preference
  "S101",   # assert in tests
  "S105",   # Hardcoded passwords in test settings
  "S301",   # pickle in tests is fine
  "S311",   # random is fine for tests
]
"tests/orm/**" = [
  "B018",   # Querysets are evaluated for the queries they run
  "DTZ001", # The ORM test settings run with USE_TZ = False
  "PT012",  # Raising inside atomic() is how the tests roll back
  "RUF012", # Django migrations and model Meta classes use mutable class attributes
  "S608",   # Raw SQL statements are what the tests exercise
  "S610",   # and so is QuerySet.extra()
]
"benchmarks/**" = [
  "ANN",     # Type annotations not required in benchmarks
  "ARG",     # Unused fixture args common
  "BLE001",  # Broad except in measurement code is fine
  "PERF401", # Loop append patterns are clearer here
  "RUF046",  # int(round()) is intentional for indexing
  "S101",    # assert
  "S106",    # The password of a throwaway PostgreSQL container
  "T201",    # print() is the output mechanism
  "TC001",   # Don't bother with TYPE_CHECKING gymnastics
  "TC003",
]
"benchmarks/ormbench/**" = [
  "DJ008",  # Nothing displays the benchmark's models
  "RUF012", # Django migrations use mutable class attributes
  "S311",   # Seeded pseudo-random numbers drive the workloads
]

[tool.djlint]
# djLint reads this list instead of stdin when the source argument is `-`, which
# is how the pre-commit hook invokes it.
files = ["django_cachex/admin/templates"]
# The admin templates extend Django's own admin, which emits `&rsaquo;` in
# breadcrumbs (H023), and they carry inline styles rather than ship a stylesheet
# the host project would have to collect (H021).
ignore = "H021,H023"
profile = "django"

[tool.mypy]
python_version = "3.14"
plugins = ["mypy_django_plugin.main"]
pretty = true
show_error_codes = true
show_error_context = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = false
disallow_any_generics = true
no_implicit_optional = true
strict_equality = true
# warn_return_any stays off: the adapter layer's job is wrapping driver calls
# that are untyped at the source, so it fires ~67 times on `return client.cmd(...)`
# and every silencing cast would assert a type nothing actually checks.
# disallow_untyped_defs stays off too: ruff's ANN rules already require
# annotations, and django-stubs' `Model.pk` types the admin models' pk setters
# in a way that rejects the correct `-> None`.

[tool.django-stubs]
django_settings_module = "tests.settings.base"

[[tool.mypy.overrides]]
module = "lz4.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "xdist.scheduler"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "msgpack"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "ormsgpack"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "orjson"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "testcontainers.*"
ignore_missing_imports = true

# valkey-glide ships only as an optional install, so let mypy skip it when absent.
[[tool.mypy.overrides]]
module = "glide.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "glide_sync.*"
ignore_missing_imports = true


[tool.ty.rules]
# Disable rules that conflict with intentional Django extensions:
# - We extend return types (set returns bool|None, delete_many returns int)
# - Parameter types widened/narrowed for better API
invalid-method-override = "ignore"

[tool.ty.environment]
python-version = "3.14"

[tool.ty.analysis]
# Ignore `# type: ignore` comments (those are for mypy)
# ty uses `# ty: ignore` for its own suppressions
respect-type-ignore-comments = false

[[tool.ty.overrides]]
include = ["tests/**"]

[tool.ty.overrides.rules]
# Tests intentionally access private attributes for verification
unresolved-attribute = "ignore"
# Tests verify edge cases with generators and None values
invalid-argument-type = "ignore"
# test_session.py assigns a mock over timezone.now for Django's session expiry path
invalid-assignment = "ignore"

# orjson is an opt-in extra (no cp314t wheel as of 3.11.8); ty mustn't fail
# the local check when the package isn't installed in the dev venv.
[[tool.ty.overrides]]
include = ["django_cachex/serializers/orjson.py"]

[tool.ty.overrides.rules]
unresolved-import = "ignore"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings.base"
# The wheel job installs the package without the project, so nothing else
# puts the repo root (and with it `tests.settings`) on sys.path.
pythonpath = ["."]
addopts = "--cov=django_cachex --cov-report=term-missing --cov-report=xml --no-cov-on-fail"
testpaths = ["tests"]
xfail_strict = true

[tool.coverage.run]
# types.py contains only type aliases and Protocol definitions - no executable code.
omit = ["tests/*", "django_cachex/types.py"]

[tool.coverage.report]
precision = 2
skip_covered = true
