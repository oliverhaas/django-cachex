default_stages: [pre-commit]
default_install_hook_types:
  - pre-commit
  - pre-push
fail_fast: false

default_language_version:
  python: python3.14

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-ast
      - id: check-case-conflict
      - id: check-json
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-toml
      - id: check-yaml
      - id: debug-statements
      - id: detect-private-key
      - id: end-of-file-fixer
        stages: [pre-commit]
      - id: mixed-line-ending
        args: ["--fix=lf"]

  - repo: https://github.com/ComPWA/taplo-pre-commit
    rev: v0.9.3
    hooks:
      - id: taplo-format
        args:
          ["--", "--indent-string", "  ", "--reorder-arrays", "--reorder-keys"]

  - repo: https://github.com/asottile/add-trailing-comma
    rev: v3.1.0
    hooks:
      - id: add-trailing-comma

  - repo: local
    hooks:
      - id: uv-sync-check
        name: uv-sync-check
        language: system
        entry: uv sync
        pass_filenames: false
      - id: ruff-check
        name: ruff-check
        entry: uv run ruff check --fix
        language: system
        pass_filenames: false
      - id: ruff-format
        name: ruff-format
        entry: uv run ruff format
        language: system
        pass_filenames: false
      # `-` makes djLint take its file list from `files` in [tool.djlint]; it
      # ignores anything pre-commit would append, so don't pass filenames.
      # PYTHON_GIL=1 because djLint's compiled module initialises unsafely on
      # the free-threaded build and dies with a NameError on _LINE_PATTERN.
      - id: djlint
        name: djlint
        entry: env PYTHON_GIL=1 uv run djlint - --lint
        language: system
        pass_filenames: false

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        language: system
        entry: uv run mypy django_cachex/
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: ty
        name: ty
        language: system
        entry: uv run ty check django_cachex/
        pass_filenames: false
        always_run: true
        stages: [pre-push]
