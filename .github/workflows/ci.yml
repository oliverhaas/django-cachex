name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --group dev --extra orjson

      - name: Run ruff check
        run: uv run ruff check --no-fix

      - name: Run ruff format check
        run: uv run ruff format --check

      - name: Run mypy check
        run: uv run mypy django_cachex/

      - name: Run ty check
        run: uv run ty check django_cachex/

      - name: Cache pre-commit hook environments
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      # ruff and the type checkers run above so their failures stay readable;
      # this adds djlint (admin templates), taplo, add-trailing-comma and the
      # pre-commit-hooks file checks, which have no separate step.
      - name: Run pre-commit hooks
        run: uv run --no-sync pre-commit run --all-files --show-diff-on-failure

  test-backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.14"
        django-version:
          - "6.0"
          - "6.1"
        client-library-version:
          - "latest"

        include:
          # Pre-release client libraries (redis-py master, valkey-py main)
          - python-version: "3.14"
            django-version: "6.1"
            client-library-version: "dev"

          # Pre-release Django
          - python-version: "3.14"
            django-version: "main"
            client-library-version: "latest"

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --group dev --extra orjson

      - name: Install Django ${{ matrix.django-version }}
        run: |
          if [ "${{ matrix.django-version }}" = "main" ]; then
            uv pip install "Django @ git+https://github.com/django/django.git@main"
          else
            uv pip install "Django~=${{ matrix.django-version }}.0"
          fi

      - name: Install pre-release client libraries
        if: matrix.client-library-version == 'dev'
        run: |
          uv pip install "redis @ git+https://github.com/redis/redis-py.git@master"
          uv pip install "valkey @ git+https://github.com/valkey-io/valkey-py.git@main"

      # Without --no-sync, `uv run` would reinstall the locked Django over the
      # pinned one above (the "6.0" cell used to run 6.1 that way).
      - name: Check the installed Django matches the matrix
        run: |
          uv run --no-sync python - "${{ matrix.django-version }}" <<'EOF'
          import sys
          import django
          want, got = sys.argv[1], django.__version__
          print("Django", got)
          ok = django.VERSION[3] != "final" if want == "main" else got.startswith(f"{want}.")
          sys.exit(0 if ok else f"expected Django {want}, got {got}")
          EOF

      - name: Run backend tests
        run: uv run --no-sync pytest tests/cache/ -n auto
        env:
          # Guard against pyc write races on first concurrent import
          # (intermittent xdist collection ImportError on fresh checkouts).
          PYTHONDONTWRITEBYTECODE: "1"

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.14' && matrix.django-version == '6.0' && matrix.client-library-version == 'latest'
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  test-admin:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        django-version: ["6.0", "6.1"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --group dev

      - name: Install Django ${{ matrix.django-version }}
        run: uv pip install "Django~=${{ matrix.django-version }}.0"

      - name: Check the installed Django matches the matrix
        run: |
          uv run --no-sync python - "${{ matrix.django-version }}" <<'EOF'
          import sys
          import django
          want, got = sys.argv[1], django.__version__
          print("Django", got)
          ok = django.VERSION[3] != "final" if want == "main" else got.startswith(f"{want}.")
          sys.exit(0 if ok else f"expected Django {want}, got {got}")
          EOF

      - name: Run admin tests
        run: uv run --no-sync pytest tests/admin/ -n auto
        env:
          PYTHONDONTWRITEBYTECODE: "1"

  test-glide-adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      # glide ships no free-threaded wheel, so this runs on GIL cp314 only.
      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --group dev --extra valkey-glide

      # The cache fixtures skip an adapter whose client library is missing
      # (_adapter_library_available in tests/fixtures/cache.py), and no other
      # job installs the glide extra, so this is the only place the shared
      # suite reaches the glide adapter. A broken glide install would turn the
      # whole slice into skips, hence the explicit import first.
      - name: Check the glide client libraries import
        run: uv run --no-sync python -c "import glide, glide_sync"

      - name: Run backend tests with the glide adapter
        run: uv run --no-sync pytest tests/cache/ -n auto
        env:
          PYTHONDONTWRITEBYTECODE: "1"

  test-freethreaded:
    name: Test on free-threaded CPython (3.14t)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      # The package advertises free-threading support in its classifiers and
      # README, so the suite has to actually run with the GIL disabled.
      - name: Set up Python
        run: uv python install 3.14t

      # No --extra orjson: it has no cp314t wheel and building it from source
      # needs a Rust toolchain. The serializer tests skip when it's absent.
      - name: Install dependencies
        run: uv sync --group dev

      # hiredis and libvalkey have not declared free-threading support, so
      # importing redis/valkey re-enables the GIL unless PYTHON_GIL=0 forces it
      # to stay off. Report the state after those imports, not before.
      - name: Report GIL state
        run: uv run --no-sync python -c "import sys, redis, valkey; print('gil_enabled =', sys._is_gil_enabled())"
        env:
          PYTHON_GIL: "0"

      - name: Run backend tests
        run: uv run --no-sync pytest tests/cache/ -n auto
        env:
          PYTHON_GIL: "0"
          PYTHONDONTWRITEBYTECODE: "1"

  build-pure-wheel:
    name: Build pure-Python wheel (django-cachex)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install 3.14

      - name: Build wheel + sdist
        run: uv build --out-dir wheelhouse/

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-pure
          path: wheelhouse/*

  test-wheel:
    name: Test wheel (pure)
    needs: build-pure-wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: wheels-pure
          path: wheelhouse

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dev dependencies (without project)
        run: uv sync --group dev --no-install-project

      - name: Install the wheel
        run: uv pip install --no-deps wheelhouse/django_cachex-*-py3-none-any.whl

      - name: Run cache tests against the built wheel
        run: uv run --no-sync pytest tests/cache/ -n auto
        env:
          PYTHONDONTWRITEBYTECODE: "1"

  smoke-test-minimal-install:
    name: Smoke-test minimal install (no client library)
    needs: build-pure-wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: wheels-pure
          path: wheelhouse

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install 3.14

      - name: Create venv and install the wheel without any client library
        run: |
          uv venv --python 3.14
          uv pip install --no-deps wheelhouse/django_cachex-*-py3-none-any.whl django asgiref sqlparse sortedcontainers

      - name: Verify imports succeed without redis-py or valkey-py installed
        run: |
          uv run --no-sync python -c "
          import django_cachex
          import django_cachex.cache, django_cachex.adapters
          from django_cachex.cache import RedisCache, ValkeyCache
          print('OK: package imports with no client library installed')
          "
