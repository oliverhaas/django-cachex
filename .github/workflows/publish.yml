name: Publish to PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g., 0.4.0)"
        required: true

jobs:
  build-pure-wheel:
    name: Build pure-Python wheel + sdist (django-cachex)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.version && format('v{0}', github.event.inputs.version) || github.ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install 3.14

      - name: Build wheel + sdist
        run: uv build --out-dir dist/

      - uses: actions/upload-artifact@v7
        with:
          name: dist-pure
          path: dist/*

  publish-pure:
    needs: build-pure-wheel
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/django-cachex/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist-pure
          path: dist

      - name: Publish django-cachex to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
