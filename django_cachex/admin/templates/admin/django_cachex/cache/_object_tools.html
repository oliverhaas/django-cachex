        <a href="{% url 'admin:django_cachex_key_changelist' %}?cache={{ cache_name|urlencode }}">{% trans 'List Keys' %}</a>

        <a href="?{% if not help_active %}help=1{% endif %}">{% trans 'Help' %}</a>
    </li>
</ul>
